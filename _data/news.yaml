news:
  - date: "June 2026"
    content: "I will be spending the summer as a Research Intern at Netflix in Los Gatos, CA. There, I will be working in the streaming algorithms team with a specific focus on improving Netlfix's Low-Latency Live Streaming approach."

  - date: "May 2026"
    content: "Our submission 'Evaluating Agentic Configuration Repair for Computer Networks' has been accepted to the ICML 2026 Workshop on Agents in the Wild taking place in Seoul, Republic of Korea!"
  
  - date: "Mar 2026"
    content: "Presented my doctoral plan on 'Controlling Complex Networked Systems' with which I have now successfully passed my Aptitude Colloquium! This confirms my official status as a PhD student at ETH Zurich and allows me to take the next steps in my research journey."

  - date: "Nov 2025"
    content: "Presented our paper 'Into the Wild: Real-World Testing for ML-Based ABR' at ACM PACMI 2025 in Seoul, Republic of Korea!"
  
  - date: "Nov 2025"
    content: "Our paper 'Learning More With Less: Sample Efficient Model-Based RL for Loco-Manipulation' was accepted to the workshop on Resource-Rational Robot Learning at CoRL 2025 in Seoul, Republic of Korea!"

  - date: "Sep 2025"
    content: "Presented our poster 'Towards Network Model Generalization using Strategic Data Collection' at ACM SIGCOMM 2025 in Coimbra, Portugal!"

  - date: "Feb 2025"
    content: "Started my PhD at ETH Zurich in the Networked Systems Group under the supervision of Prof. Laurent Vanbever."